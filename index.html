<!doctype html>
<html lang="en" data-mu-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://api.munetios.com 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' https://api.munetios.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Munetios Blog</title>
  <meta name="description" content="Product updates and announcements from Munetios.">
  <meta name="google-site-verification" content="eNlW8gDjbwlEBSfYIkyc8N60d64cbCYkYydrbDoeYi8">
  <meta name="author" content="Munetios">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Munetios Blog">
  <meta property="og:description" content="Product updates and announcements from Munetios.">
  <meta property="og:url" content="https://blog.munetios.com/">
  <meta property="og:image" content="https://www.munetios.com/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Munetios Blog">
  <meta name="twitter:description" content="Product updates and announcements from Munetios.">
  <meta name="twitter:image" content="https://www.munetios.com/og-image.jpg">
  <link rel="canonical" href="https://blog.munetios.com/">
  <link rel="icon" href="munetios.ico">
  <link rel="stylesheet" href="https://api.munetios.com/beautiful-css/beautiful.css">
  <link rel="stylesheet" href="munetios-ui/munetios-ui-v4.css">
  <link rel="stylesheet" href="blog.css">
  <script defer src="munetios-ui/munetios-ui-v4.js"></script>
  <script type="module" src="blog.js"></script>
</head>
<body class="mu-root">
  <a class="mu-btn blog-skip" href="#blog-content" data-t="skip">Skip to content</a>
  <header class="mu-topbar blog-topbar blog-width">
    <a class="mu-capsule liquid-glass blog-brand" href="#/">
      <img src="munetios-logo.png" width="32" height="32" alt="">
      <span>Munetios Blog</span>
    </a>
    <nav class="mu-capsule liquid-glass blog-nav" data-aria="navigation" aria-label="Blog navigation">
      <a class="mu-icon-btn blog-archive-button" href="#/all" data-aria="archive" aria-label="Archive"><span class="mu-icon" aria-hidden="true">inventory_2</span></a>
      <button class="mu-icon-btn" type="button" data-mu-open="blog-search" data-aria="search" aria-label="Search posts"><span class="mu-icon" aria-hidden="true">search</span></button>
      <button class="mu-icon-btn" type="button" data-mu-open="blog-preferences" data-aria="preferences" aria-label="Settings"><span class="mu-icon" aria-hidden="true">settings</span></button>
    </nav>
  </header>
  <main class="blog-width" id="blog-content" tabindex="-1">
    <h1 class="mu-h-display">Munetios Blog</h1>
    <noscript><p>Enable JavaScript to browse Munetios Blog.</p></noscript>
  </main>
  <footer class="blog-width blog-footer">
    <span>© 2026 Munetios</span>
    <nav data-aria="footerNavigation" aria-label="Munetios links">
      <a href="https://www.munetios.com" data-t="munetiosHome">Munetios home</a>
      <a href="https://www.munetios.com/about" data-t="about">About</a>
      <a href="https://www.youtube.com/@munetios">YouTube</a>
      <a href="https://github.com/Munetios/Munetios-Blog">GitHub</a>
    </nav>
  </footer>

  <div class="mu-modal" id="blog-search" hidden>
    <section class="mu-dialog liquid-glass" role="dialog" aria-labelledby="search-title">
      <div class="mu-dialog-header">
        <h2 id="search-title" data-t="search">Search posts</h2>
        <button class="mu-icon-btn mu-icon-btn-soft" type="button" data-mu-close data-aria="close" aria-label="Close"><span class="mu-icon" aria-hidden="true">close</span></button>
      </div>
      <form class="mu-dialog-body blog-control-stack" id="search-form">
        <label class="mu-search">
          <span class="mu-icon" aria-hidden="true">search</span>
          <input id="search-input" type="search" name="q" required autocomplete="off" data-aria="search" aria-label="Search posts" data-placeholder="searchPlaceholder" placeholder="Titles, topics, and keywords">
        </label>
        <button class="mu-btn mu-btn-primary" type="submit" data-t="submitSearch">Search</button>
      </form>
    </section>
  </div>

  <div class="mu-modal" id="blog-preferences" hidden>
    <section class="mu-dialog liquid-glass" role="dialog" aria-labelledby="preferences-title">
      <div class="mu-dialog-header">
        <h2 id="preferences-title" data-t="preferences">Settings</h2>
        <button class="mu-icon-btn mu-icon-btn-soft" type="button" data-mu-close data-aria="close" aria-label="Close"><span class="mu-icon" aria-hidden="true">close</span></button>
      </div>
      <div class="mu-dialog-body blog-control-stack">
        <label id="theme-label" for="blog-theme" data-t="theme">Theme</label>
        <select class="mu-select" id="blog-theme" aria-labelledby="theme-label">
          <option value="system" data-t="system">System</option>
          <option value="light" data-t="light">Light</option>
          <option value="dark" data-t="dark">Dark</option>
        </select>
        <label id="language-label" for="blog-language" data-t="language">Interface language</label>
        <select class="mu-select" id="blog-language" aria-labelledby="language-label">
          <option value="en-US" lang="en-US">English (United States)</option>
          <option value="es-419" lang="es-419">Español (Latinoamérica)</option>
          <option value="es-ES" lang="es-ES">Español (España)</option>
          <option value="es-MX" lang="es-MX">Español (México)</option>
          <option value="es-US" lang="es-US">Español (Estados Unidos)</option>
          <option value="fr-FR" lang="fr-FR">Français (France)</option>
          <option value="pt-BR" lang="pt-BR">Português (Brasil)</option>
        </select>
      </div>
    </section>
  </div>

  <div class="mu-modal" id="blog-share" hidden>
    <section class="mu-dialog liquid-glass" role="dialog" aria-labelledby="share-title">
      <div class="mu-dialog-header">
        <h2 id="share-title" data-t="share">Share</h2>
        <button class="mu-icon-btn mu-icon-btn-soft" type="button" data-mu-close data-aria="close" aria-label="Close"><span class="mu-icon" aria-hidden="true">close</span></button>
      </div>
      <div class="mu-dialog-body blog-control-stack">
        <input class="mu-input" id="share-url" readonly data-aria="shareUrl" aria-label="Post link">
        <button class="mu-btn mu-btn-primary" type="button" id="copy-link"><span class="mu-icon" aria-hidden="true">link</span><span data-t="copy">Copy link</span></button>
        <a class="mu-btn" id="share-facebook" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a class="mu-btn" id="share-chatgpt" target="_blank" rel="noopener noreferrer">ChatGPT</a>
        <p id="copy-status" role="status"></p>
      </div>
    </section>
  </div>
</body>
</html>
